<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 适配检测报告</title>
<style>
  :root {
    --bg: #070b14;
    --card: #0d1526;
    --card-border: rgba(148, 163, 184, 0.14);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-faint: #64748b;
    --cyan: #22d3ee;
    --violet: #818cf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -3;
    background-image:
      linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
  }
  .glow {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(600px 300px at 50% -10%, rgba(34,211,238,0.14), transparent 70%),
      radial-gradient(500px 300px at 85% 40%, rgba(129,140,248,0.08), transparent 70%);
  }
  .particle {
    position: fixed; bottom: -8px; border-radius: 50%; z-index: -1; pointer-events: none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: 0.55; }
    100% { transform: translateY(-92vh); opacity: 0; }
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 56px 24px 72px; }

  /* 头部 */
  .head { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .head .logo {
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(129,140,248,0.22));
    border: 1px solid rgba(34,211,238,0.35);
    display: flex; align-items: center; justify-content: center;
    color: var(--cyan);
    box-shadow: 0 0 24px rgba(34,211,238,0.18);
  }
  .head .logo svg { width: 26px; height: 26px; }
  .head h1 {
    font-size: 27px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(120deg, #f1f5f9, #94a3b8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head .tag { font-size: 11px; letter-spacing: 3px; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }
  .head .meta { margin-top: 6px; font-size: 13px; color: var(--text-faint); display: flex; gap: 18px; flex-wrap: wrap; }

  /* 结论区 */
  .verdict {
    text-align: center;
    padding: 54px 28px 50px;
    background: linear-gradient(180deg, rgba(13,21,38,0.92), rgba(13,21,38,0.55));
    border: 1px solid var(--card-border); border-radius: 20px;
    position: relative; overflow: hidden; margin-bottom: 40px;
  }
  .verdict::before {
    content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--verdict-color, var(--cyan)), transparent);
  }
  .verdict .halo {
    position: absolute; left: 50%; top: 50%; width: 420px; height: 420px;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, transparent 10%, var(--verdict-color, var(--cyan)), transparent 30%);
    -webkit-mask: radial-gradient(circle, transparent 52%, #000 56%, #000 58%, transparent 62%);
    mask: radial-gradient(circle, transparent 52%, #000 56%, #000 58%, transparent 62%);
    opacity: 0.55; pointer-events: none;
    animation: spin 7s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .verdict .v-icon { width: 46px; height: 46px; margin: 0 auto 10px; color: var(--verdict-color, var(--cyan)); filter: drop-shadow(0 0 12px currentColor); }
  .verdict .label { font-size: 12px; letter-spacing: 5px; color: var(--text-faint); margin-bottom: 14px; }
  .verdict .word {
    font-size: 54px; font-weight: 800; letter-spacing: 8px; line-height: 1.2;
    color: var(--verdict-color, var(--cyan));
    text-shadow: 0 0 46px color-mix(in srgb, var(--verdict-color, var(--cyan)) 42%, transparent);
    animation: pulse 3.2s ease-in-out infinite;
    position: relative;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.84; } }
  .verdict .summary { margin-top: 18px; font-size: 15px; color: var(--text-dim); max-width: 600px; margin-inline: auto; }
  .verdict .conf {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: 2px; color: var(--text-faint);
    background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.22);
    border-radius: 999px; padding: 5px 14px;
  }
  .verdict .conf b { color: var(--text-dim); font-weight: 600; }
  .verdict .conf.hi b { color: var(--green); }
  .verdict .conf.mid b { color: var(--amber); }
  .verdict .conf.low b { color: var(--red); }

  /* 风险提醒 */
  .risk-note {
    max-width: 720px; margin: -18px auto 44px;
    display: flex; gap: 12px; align-items: flex-start;
    background: linear-gradient(160deg, rgba(251,191,36,0.10), rgba(251,191,36,0.04));
    border: 1px solid rgba(251,191,36,0.32); border-left: 3px solid var(--amber);
    border-radius: 12px; padding: 14px 16px;
    font-size: 13.5px; color: #fde68a; line-height: 1.75; text-align: left;
  }
  .risk-note svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--amber); }
  .risk-note b { color: #fcd34d; font-weight: 600; }

  /* 区块 */
  section { margin-bottom: 44px; }
  .sec-title {
    font-size: 14px; font-weight: 600; letter-spacing: 3px; color: var(--text-dim);
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  }
  .sec-title::before { content: ""; width: 18px; height: 1px; background: var(--cyan); }
  .sec-title svg { width: 16px; height: 16px; color: var(--cyan); }

  /* 词云 */
  .cloud-card {
    background: linear-gradient(160deg, rgba(13,21,38,0.85), rgba(13,21,38,0.5));
    border: 1px solid var(--card-border); border-radius: 18px;
    padding: 18px 10px 10px; position: relative; overflow: hidden;
  }
  .cloud-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(320px 200px at 50% 50%, rgba(34,211,238,0.06), transparent 70%);
  }
  .cloud-card svg { display: block; width: 100%; height: auto; }
  .cloud-card .cw { transition: opacity .2s ease, filter .2s ease; }
  .cloud-card .cw:hover { opacity: 1 !important; filter: drop-shadow(0 0 7px currentColor); }

  /* 雷达图 */
  .radar-card {
    background: linear-gradient(160deg, rgba(13,21,38,0.85), rgba(13,21,38,0.5));
    border: 1px solid var(--card-border); border-radius: 18px;
    padding: 22px 16px 12px; margin-bottom: 18px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .radar-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(360px 260px at 50% 45%, rgba(34,211,238,0.06), transparent 70%);
  }
  .radar-card svg { width: 100%; max-width: 480px; height: auto; position: relative; }
  .radar-card svg text { fill: var(--text-dim); font-size: 12.5px; }
  .radar-note { margin-top: 6px; font-size: 11.5px; letter-spacing: 2px; color: var(--text-faint); }

  /* 维度卡片 */
  .dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dim {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    padding: 16px; position: relative; overflow: hidden;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .dim:hover { border-color: rgba(148,163,184,0.4); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  .dim::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .dim.ok::before { background: var(--green); box-shadow: 0 0 12px rgba(52,211,153,0.55); }
  .dim.mid::before { background: var(--amber); box-shadow: 0 0 12px rgba(251,191,36,0.55); }
  .dim.bad::before { background: var(--red); box-shadow: 0 0 12px rgba(248,113,113,0.55); }
  .dim.unk::before { background: var(--text-faint); box-shadow: 0 0 12px rgba(100,116,139,0.4); }
  .dim .d-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .dim .d-ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dim .d-ic svg { width: 16px; height: 16px; }
  .dim.ok .d-ic { background: rgba(52,211,153,0.12); color: var(--green); }
  .dim.mid .d-ic { background: rgba(251,191,36,0.12); color: var(--amber); }
  .dim.bad .d-ic { background: rgba(248,113,113,0.12); color: var(--red); }
  .dim.unk .d-ic { background: rgba(148,163,184,0.14); color: var(--text-faint); }
  .dim .d-name { font-size: 14px; font-weight: 600; }
  .dim .d-state { font-size: 12px; font-weight: 600; letter-spacing: 2px; }
  .dim.ok .d-state { color: var(--green); }
  .dim.mid .d-state { color: var(--amber); }
  .dim.bad .d-state { color: var(--red); }
  .dim.unk .d-state { color: var(--text-faint); }
  .dim .d-reason { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }

  /* 依据列表 */
  .basis-list { list-style: none; }
  .basis-list li {
    display: flex; gap: 12px; align-items: flex-start; padding: 11px 0;
    border-bottom: 1px solid rgba(148,163,184,0.08);
    font-size: 14px; color: var(--text-dim);
  }
  .basis-list li .b-ic { color: var(--cyan); flex-shrink: 0; margin-top: 2px; }
  .basis-list li .b-ic svg { width: 15px; height: 15px; }

  /* 风险提示列表 */
  .risk-list { list-style: none; }
  .risk-list li {
    display: flex; gap: 12px; align-items: flex-start; padding: 11px 0;
    border-bottom: 1px solid rgba(148,163,184,0.08);
    font-size: 14px; color: var(--text-dim);
  }
  .risk-list li .r-ic { color: var(--amber); flex-shrink: 0; margin-top: 2px; }
  .risk-list li .r-ic svg { width: 15px; height: 15px; }

  /* 机会点 */
  .opps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .opp {
    background: linear-gradient(160deg, rgba(34,211,238,0.08), rgba(13,21,38,0.92) 55%);
    border: 1px solid rgba(34,211,238,0.22); border-radius: 14px; padding: 17px 16px 16px;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .opp:hover { transform: translateY(-3px); border-color: rgba(34,211,238,0.45); box-shadow: 0 8px 30px rgba(34,211,238,0.08); }
  .opp .o-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .opp .o-title { font-size: 15px; font-weight: 700; color: var(--cyan); }
  .opp .o-title svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .opp .o-badge {
    font-size: 11.5px; font-weight: 700; letter-spacing: 1px; white-space: nowrap;
    padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor;
  }
  .opp .o-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.65; margin-bottom: 12px; }
  .opp .o-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .opp .o-m { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
  .opp .o-m .k { color: var(--text-faint); letter-spacing: 1px; }
  .opp .o-m .v { font-weight: 700; }
  .opp .o-poc {
    background: rgba(13,21,38,0.72); border: 1px dashed rgba(129,140,248,0.35);
    border-radius: 10px; padding: 11px 13px; font-size: 12px; color: var(--text-dim); line-height: 1.7;
  }
  .opp .o-poc b { color: var(--violet); font-weight: 600; }
  @media (max-width: 760px) { .opps { grid-template-columns: 1fr; } }

  /* ===== v2 视觉升级：深空科技 ===== */
  :root {
    --bg: #04060d;
    --card-solid: #0c1424;
    --text: #e8edf7;
    --text-dim: #9aa8bd;
    --grad: linear-gradient(120deg, #22d3ee, #818cf8);
  }
  html { scrollbar-color: rgba(129,140,248,0.4) #060a14; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #060a14; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #22d3ee, #818cf8); border-radius: 8px; border: 2px solid #060a14; }
  ::selection { background: rgba(34,211,238,0.32); color: #fff; }

  body {
    background:
      radial-gradient(1200px 800px at 82% -10%, rgba(34,211,238,0.09), transparent 60%),
      radial-gradient(1000px 700px at 8% 18%, rgba(129,140,248,0.08), transparent 55%),
      #04060d;
  }

  /* 星野 */
  .stars {
    position: fixed; inset: 0; z-index: -4; pointer-events: none;
    background-image:
      radial-gradient(1.2px 1.2px at 15% 25%, rgba(255,255,255,0.6), transparent 100%),
      radial-gradient(1px 1px at 35% 60%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1.4px 1.4px at 55% 14%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.45), transparent 100%),
      radial-gradient(1.2px 1.2px at 90% 70%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.35), transparent 100%),
      radial-gradient(1px 1px at 65% 92%, rgba(255,255,255,0.4), transparent 100%);
    background-size: 340px 340px;
    animation: twinkle 9s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .5; } to { opacity: 1; } }

  /* 极光 */
  .aurora { position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden; }
  .aurora::before, .aurora::after { content: ""; position: absolute; border-radius: 50%; filter: blur(100px); }
  .aurora::before { width: 560px; height: 560px; left: -160px; top: -120px; background: radial-gradient(circle, rgba(34,211,238,0.22), transparent 70%); animation: driftA 20s ease-in-out infinite alternate; }
  .aurora::after { width: 620px; height: 620px; right: -180px; top: 28%; background: radial-gradient(circle, rgba(129,140,248,0.18), transparent 70%); animation: driftB 26s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(70px, 50px) scale(1.18); } }
  @keyframes driftB { to { transform: translate(-60px, -40px) scale(1.12); } }

  .wrap { padding-top: 64px; }

  /* 头部 */
  .head { position: relative; margin-bottom: 44px; }
  .head .logo { position: relative; width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 0 30px rgba(34,211,238,0.25), inset 0 0 18px rgba(34,211,238,0.12); border-color: rgba(34,211,238,0.45); }
  .head .logo::after {
    content: ""; position: absolute; inset: -5px; border-radius: 20px;
    background: conic-gradient(from 0deg, transparent 15%, rgba(34,211,238,0.9), transparent 40%);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 66%); mask: radial-gradient(circle, transparent 62%, #000 66%);
    animation: spin 5.5s linear infinite; pointer-events: none;
  }
  .head .logo svg { width: 28px; height: 28px; }
  .head h1 {
    font-size: 30px; letter-spacing: 2px;
    background: linear-gradient(120deg, #ffffff, #9aa8bd 55%, #22d3ee);
    background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 220% center; } }
  .head .tag { color: rgba(129,140,248,0.85); letter-spacing: 4px; }
  .head .meta { gap: 22px; }

  /* 结论区 */
  .verdict {
    padding: 60px 30px 56px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(13,22,40,0.92), rgba(8,12,24,0.6));
    box-shadow: 0 30px 90px rgba(0,0,0,0.5), inset 0 0 80px rgba(34,211,238,0.03);
  }
  .verdict::before { height: 2px; left: 8%; right: 8%; background: linear-gradient(90deg, transparent, var(--verdict-color, var(--cyan)), transparent); }
  .verdict::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(520px 260px at 50% 0%, color-mix(in srgb, var(--verdict-color, var(--cyan)) 14%, transparent), transparent 72%);
  }
  .verdict .halo { width: 480px; height: 480px; opacity: .72; }
  .verdict .halo::after {
    content: ""; position: absolute; inset: 46px; border-radius: 50%;
    border: 1px dashed color-mix(in srgb, var(--verdict-color, var(--cyan)) 40%, transparent);
    animation: spinReverse 14s linear infinite;
  }
  @keyframes spinReverse { to { transform: rotate(-360deg); } }
  .verdict .v-icon { width: 54px; height: 54px; filter: drop-shadow(0 0 20px currentColor); }
  .verdict .label { letter-spacing: 6px; }
  .verdict .word {
    font-size: 60px; letter-spacing: 12px;
    background: linear-gradient(120deg, #fff 0%, var(--verdict-color, var(--cyan)) 45%, #fff 90%);
    background-size: 220% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 0 36px color-mix(in srgb, var(--verdict-color, var(--cyan)) 45%, transparent));
  }
  .verdict .summary { font-size: 15.5px; color: #aab6ca; }
  .verdict .conf { background: rgba(148,163,184,0.1); border-color: rgba(148,163,184,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* 风险提醒 */
  .risk-note { box-shadow: 0 0 34px rgba(251,191,36,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* 区块标题 */
  .sec-title { font-size: 15px; letter-spacing: 4px; color: #c7d2e4; margin-bottom: 22px; }
  .sec-title::before { width: 26px; height: 2px; background: var(--grad); box-shadow: 0 0 10px rgba(34,211,238,0.6); }
  .sec-title svg { filter: drop-shadow(0 0 7px rgba(34,211,238,0.65)); }

  /* 玻璃卡片 */
  .radar-card, .cloud-card, .action {
    background: linear-gradient(160deg, rgba(13,22,40,0.86), rgba(8,13,26,0.72));
    border: 1px solid rgba(148,163,184,0.16);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 22px 70px rgba(0,0,0,0.42);
  }
  .radar-card { border-radius: 22px; }
  .radar-card::before { background: radial-gradient(420px 300px at 50% 40%, rgba(34,211,238,0.1), transparent 70%); }
  .radar-card svg text { fill: #aab6ca; font-weight: 600; }
  .radar-note { letter-spacing: 3px; }
  .cloud-card { border-radius: 22px; }

  /* 就绪度卡片 */
  .dim {
    background: rgba(13,22,40,0.78); border-radius: 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 34px rgba(0,0,0,0.32);
  }
  .dim:hover { transform: translateY(-5px); box-shadow: 0 20px 54px rgba(0,0,0,0.5); }
  .dim::before { height: 3px; }
  .dim .d-ic { border-radius: 10px; }
  .dim.ok .d-ic { background: rgba(52,211,153,0.16); box-shadow: 0 0 16px rgba(52,211,153,0.18); }
  .dim.mid .d-ic { background: rgba(251,191,36,0.16); box-shadow: 0 0 16px rgba(251,191,36,0.18); }
  .dim.bad .d-ic { background: rgba(248,113,113,0.16); box-shadow: 0 0 16px rgba(248,113,113,0.18); }
  .dim.unk .d-ic { background: rgba(148,163,184,0.18); }
  .dim .d-reason { font-size: 12.5px; }

  /* 列表 */
  .basis-list li, .risk-list li { padding: 13px 0; }
  .basis-list li .b-ic, .risk-list li .r-ic {
    width: 22px; height: 22px; border-radius: 7px; margin-top: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(34,211,238,0.12);
  }
  .basis-list li .b-ic svg, .risk-list li .r-ic svg { width: 13px; height: 13px; }
  .risk-list li .r-ic { background: rgba(251,191,36,0.14); }

  /* 任务卡 */
  .opps { perspective: 1400px; }
  .opp {
    border-radius: 18px; transform-style: preserve-3d;
    background: linear-gradient(160deg, rgba(13,22,40,0.92), rgba(10,16,32,0.86));
    border: 1px solid rgba(34,211,238,0.18);
    box-shadow: 0 16px 44px rgba(0,0,0,0.38);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .opp::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(150deg, rgba(34,211,238,0.6), rgba(129,140,248,0.45) 40%, transparent 72%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;

    // 维度标签
    for (var i = 0; i < n; i++) {
      var lp = pt(i, R + 27);
      var anchor = Math.abs(lp[0] - cx) < 12 ? "middle" : (lp[0] < cx ? "end" : "start");
      var ly = lp[1] + (lp[1] < cy ? -2 : 7);
      html += '<text x="' + lp[0].toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + names[i] + '</text>';
    }
    svg.innerHTML = html;
    // 入场动画
    var shape = svg.querySelector("#radar-shape");
    if (shape) {
      shape.style.transformOrigin = cx + "px " + cy + "px";
      shape.style.transform = "scale(0.3)";
      shape.style.opacity = "0";
      shape.style.transition = "transform .9s cubic-bezier(.22,1,.36,1), opacity .8s ease";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          shape.style.transform = "scale(1)";
          shape.style.opacity = "1";
        });
      });
    }
  })();

  // 就绪度明细卡片
  var dims = document.getElementById("dims");
  D.readiness.forEach(function (d) {
    var el = document.createElement("div");
    el.className = "dim " + (d.state || "unk");
    el.innerHTML =
      '<div class="d-top">' +
        '<div class="d-ic">' + svgIcon(DIM_ICON[d.name] || "chart") + '</div>' +
        '<div class="d-name">' + d.name + '</div>' +
      '</div>' +
      '<div class="d-state">' + (d.stateText || (d.state === "unk" ? "未知" : d.state)) + '</div>' +
      '<div class="d-reason">' + d.reason + '</div>';
    dims.appendChild(el);
  });

  // 判断依据
  var basis = document.getElementById("basis");
  D.basis.forEach(function (t) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="b-ic">' + svgIcon("check") + '</span><span>' + t + '</span>';
    basis.appendChild(li);
  });

  // 风险提示
  var risks = document.getElementById("risks");
  if (D.risks && D.risks.length) {
    D.risks.forEach(function (t) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="r-ic">' + svgIcon("alert") + '</span><span>' + t + '</span>';
      risks.appendChild(li);
    });
  } else {
    document.getElementById("risks-title").closest("section").style.display = "none";
  }

  // Top AI 机会（任务级）
  var opps = document.getElementById("opps");
  D.opportunities.forEach(function (o, i) {
    var el = document.createElement("div");
    el.className = "opp";
    var badgeColor = OP_COLOR[o.verdict] || "#22d3ee";
    var mKeys = [["opportunity", "Opportunity"], ["feasibility", "Feasibility"], ["risk", "Risk"], ["economics", "Economics"]];
    var metricsHtml = mKeys.map(function (mk) {
      var v = (o.metrics || {})[mk[0]] || "未知";
      return '<div class="o-m"><span class="k">' + mk[1] + '</span><span class="v" style="color:' + metricColor(mk[0], v) + '">' + v + '</span></div>';
    }).join("");
    var pocHtml = "";
    if (o.poc) {
      pocHtml = '<div class="o-poc"><b>最小验证方案</b><br>目标：' + o.poc.goal + '<br>数据：' + o.poc.data +
        '<br>方式：' + o.poc.method + '<br>成功标准：' + o.poc.success + '</div>';
    }
    el.innerHTML =
      '<div class="o-top">' +
        '<div class="o-title">' + svgIcon(OPP_ICON[i % OPP_ICON.length]) + o.title + '</div>' +
        '<div class="o-badge" style="color:' + badgeColor + '">' + o.verdict + '</div>' +
      '</div>' +
      '<div class="o-metrics">' + metricsHtml + '</div>' +
      '<div class="o-desc">' + o.desc + '</div>' +
      pocHtml;
    opps.appendChild(el);
  });

  // 行动
  document.getElementById("a-ic").innerHTML = svgIcon("target");
  document.getElementById("action").innerHTML = D.action;

  // 浮动粒子
  var colors = ["#22d3ee", "#818cf8", "#34d399", "#f472b6"];
  for (var p = 0; p < 16; p++) {
    var dot = document.createElement("div");
    dot.className = "particle";
    var size = 1 + Math.random() * 2.4;
    dot.style.cssText =
      "left:" + (Math.random() * 100).toFixed(1) + "vw;" +
      "width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;" +
      "background:" + colors[p % colors.length] + ";" +
      "opacity:0;" +
      "animation-duration:" + (8 + Math.random() * 10).toFixed(1) + "s;" +
      "animation-delay:" + (Math.random() * 8).toFixed(1) + "s;";
    document.body.appendChild(dot);
  }

  // 滚动渐显
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
  }

  // 任务卡 3D 倾斜
  document.querySelectorAll(".opp").forEach(function (card) {
    card.addEventListener("mousemove", function (e) {
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = "translateY(-4px) rotateX(" + (-y * 5).toFixed(2) + "deg) rotateY(" + (x * 5).toFixed(2) + "deg)";
    });
    card.addEventListener("mouseleave", function () { card.style.transform = ""; });
  });
})();
</script>
</body>
</html>
